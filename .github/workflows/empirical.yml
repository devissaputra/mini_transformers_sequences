name: Empirical Study
on:
  push:
    branches: [main]
    paths: ["src/run_experiment.py", "requirements.txt", ".github/workflows/empirical.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: empirical-study-main
  cancel-in-progress: false
jobs:
  run-study:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: PYTHONPATH=. python src/run_experiment.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/metrics.json results/summary.md results/figures paper/results.md
          if git diff --cached --quiet; then echo "No result changes"; else git commit -m "research: regenerate SILSO forecasting results" && git push; fi
