name: Empirical Study
on:
  push:
    branches: [main]
    paths: ["src/run_experiment.py", "requirements.txt", ".github/workflows/empirical.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: empirical-study-main
  cancel-in-progress: false
jobs:
  run-study:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: PYTHONPATH=. python src/run_experiment.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/silso-generated/paper
          cp -a results /tmp/silso-generated/results
          cp paper/results.md paper/results.tex /tmp/silso-generated/paper/
          start_source_sha=$(git rev-parse HEAD:src/run_experiment.py)
          start_requirements_sha=$(git rev-parse HEAD:requirements.txt)
          git fetch origin main
          latest_source_sha=$(git rev-parse origin/main:src/run_experiment.py)
          latest_requirements_sha=$(git rev-parse origin/main:requirements.txt)
          if [ "$start_source_sha" != "$latest_source_sha" ] || [ "$start_requirements_sha" != "$latest_requirements_sha" ]; then
            echo "Newer research code or dependencies reached main; skipping stale result publication."
            exit 0
          fi
          git reset --hard origin/main
          rm -rf results
          cp -a /tmp/silso-generated/results ./results
          cp /tmp/silso-generated/paper/results.md paper/results.md
          cp /tmp/silso-generated/paper/results.tex paper/results.tex
          git add results paper/results.md paper/results.tex
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "research: regenerate SILSO forecasting results"
            git push origin HEAD:main
          fi
