name: Reproduce Research Bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: python -m pip install -r requirements.txt
      - name: Run real-data research study
        run: python src/run_experiment.py
      - name: Upload research outputs
        uses: actions/upload-artifact@v4
        with:
          name: research-bundle-results
          path: |
            results/
            paper/results.md
            paper/results.tex
