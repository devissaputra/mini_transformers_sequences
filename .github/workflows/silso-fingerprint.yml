name: Temporary SILSO Fingerprint

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/silso-fingerprint.yml"

permissions:
  contents: read

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Compute frozen study-input fingerprint
        run: |
          python - <<'PY'
          import csv, hashlib, io, urllib.request
          url = "https://www.sidc.be/SILSO/DATA/SN_m_tot_V2.0.csv"
          raw = urllib.request.urlopen(url, timeout=120).read()
          rows = []
          for row in csv.reader(io.StringIO(raw.decode("utf-8")), delimiter=";"):
              if len(row) < 7:
                  continue
              try:
                  year, month = int(row[0]), int(row[1])
                  sunspots = float(row[3])
                  flag = int(row[6])
              except (ValueError, IndexError):
                  continue
              if sunspots < 0 or flag != 1:
                  continue
              ym = f"{year:04d}-{month:02d}"
              if ym <= "2026-03":
                  rows.append(f"{ym};{sunspots:.1f}")
          payload = ("\n".join(rows) + "\n").encode()
          print("RAW_SHA256=" + hashlib.sha256(raw).hexdigest())
          print("STUDY_ROWS=" + str(len(rows)))
          print("LAST_STUDY_ROW=" + rows[-1])
          print("STUDY_INPUT_SHA256=" + hashlib.sha256(payload).hexdigest())
          PY
