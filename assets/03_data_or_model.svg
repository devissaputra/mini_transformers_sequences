<text x="710" y="320" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#6b21a8">4-head attention</text>
<text x="710" y="415" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#6b21a8">FFN width 64</text>
<text x="710" y="485" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">1 encoder layer · dropout 0.1</text>
