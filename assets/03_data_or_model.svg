<text x="1020" y="472" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">direct forecast</text><text x="1020" y="505" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">h = 1 · 6 · 12</text>
