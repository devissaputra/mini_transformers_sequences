<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675">
<rect width="1200" height="675" fill="#f8fafc"/>
<text x="60" y="75" font-family="Arial" font-size="34" font-weight="700" fill="#0f172a">Mini Transformer Architecture</text>
<text x="60" y="112" font-family="Arial" font-size="19" fill="#64748b">Each scalar observation becomes a 24-dimensional token, receives a learned positional vector, and enters multi-head self-attention.</text>

<rect x="55" y="180" width="210" height="390" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="160" y="225" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#1e40af">Input sequence</text>
<g fill="#bfdbfe" stroke="#60a5fa" stroke-width="2"><rect x="95" y="280" width="130" height="38" rx="8"/><rect x="95" y="330" width="130" height="38" rx="8"/><rect x="95" y="380" width="130" height="38" rx="8"/><rect x="95" y="430" width="130" height="38" rx="8"/></g>
<text x="160" y="300" text-anchor="middle" font-family="Arial" font-size="16" fill="#1e3a8a">year t-23</text><text x="160" y="350" text-anchor="middle" font-family="Arial" font-size="16" fill="#1e3a8a">year t-22</text><text x="160" y="400" text-anchor="middle" font-family="Arial" font-size="16" fill="#1e3a8a">…</text><text x="160" y="450" text-anchor="middle" font-family="Arial" font-size="16" fill="#1e3a8a">year t</text>
<text x="160" y="520" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">24 scalar tokens</text>

<rect x="315" y="180" width="210" height="390" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="420" y="225" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#166534">Embedding</text>
<rect x="355" y="300" width="130" height="90" rx="16" fill="#dcfce7" stroke="#4ade80" stroke-width="3"/>
<text x="420" y="337" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#166534">Linear 1→24</text>
<text x="420" y="370" text-anchor="middle" font-family="Arial" font-size="17" fill="#334155">+ learned position</text>
<text x="420" y="470" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">24 × 24 tensor</text>

<rect x="575" y="180" width="270" height="390" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="710" y="225" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#7e22ce">Transformer encoder</text>
<g fill="#f3e8ff" stroke="#c084fc" stroke-width="2"><rect x="625" y="280" width="170" height="70" rx="14"/><rect x="625" y="375" width="170" height="70" rx="14"/></g>
<text x="710" y="320" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#6b21a8">4-head attention</text>
<text x="710" y="415" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#6b21a8">FFN width 48</text>
<text x="710" y="485" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">1 encoder layer • dropout 0.1</text>

<rect x="895" y="180" width="250" height="390" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="1020" y="225" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#9a3412">Forecast head</text>
<rect x="950" y="310" width="140" height="90" rx="16" fill="#ffedd5" stroke="#fb923c" stroke-width="3"/>
<text x="1020" y="348" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#9a3412">last token</text>
<text x="1020" y="378" text-anchor="middle" font-family="Arial" font-size="18" fill="#334155">Linear 24→1</text>
<text x="1020" y="480" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">next-year sunspot value</text>

<g stroke="#2563eb" stroke-width="5"><path d="M265 375 H315"/><path d="M525 375 H575"/><path d="M845 375 H895"/></g>
</svg>