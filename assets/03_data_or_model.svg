<text x="160" y="302" text-anchor="middle" font-family="Arial" font-size="16" fill="#1e3a8a">month t-131</text><text x="160" y="352" text-anchor="middle" font-family="Arial" font-size="16" fill="#1e3a8a">month t-130</text><text x="160" y="402" text-anchor="middle" font-family="Arial" font-size="16" fill="#1e3a8a">…</text><text x="160" y="452" text-anchor="middle" font-family="Arial" font-size="16" fill="#1e3a8a">month t</text>
<text x="160" y="520" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">132 scalar tokens</text>
<rect x="315" y="180" width="210" height="390" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="420" y="225" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#166534">Embedding</text>
<rect x="345" y="295" width="150" height="105" rx="16" fill="#dcfce7" stroke="#4ade80" stroke-width="3"/>
<text x="420" y="335" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#166534">Linear 1→32</text>
<text x="420" y="372" text-anchor="middle" font-family="Arial" font-size="17" fill="#334155">+ sinusoidal position</text>
<text x="420" y="470" text-anchor="middle" font-family="Arial" font-size="18" fill="#64748b">132 × 32 tensor</text>
