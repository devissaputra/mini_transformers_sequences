<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000"><rect width="1600" height="1000" fill="#f8fbff"/><text x="60" y="68" font-size="46" font-family="Arial" font-weight="700" fill="#12345b">Mini Transformers for Sequences</text><text x="62" y="108" font-size="23" font-family="Arial" fill="#5b6b82">Data Processing & Experimental Pipeline · raw evidence to reproducible evaluation</text><rect x="45" y="155" width="240" height="310" rx="18" fill="#fff" stroke="#bfd0e2" stroke-width="2"/><circle cx="76" cy="189" r="23" fill="#2f80d1"/><text x="76" y="197" text-anchor="middle" font-size="22" font-family="Arial" font-weight="700" fill="#fff">1</text><text x="107" y="190" font-size="20" font-family="Arial" font-weight="700" fill="#12345b">Sequence ingest</text><text x="67" y="267" font-size="17" font-family="Arial" font-weight="400" fill="#5b6b82">Define tokens, order,</text><text x="67" y="291" font-size="17" font-family="Arial" font-weight="400" fill="#5b6b82">targets, and leakage rules.</text><line x1="285" y1="305" x2="299" y2="305" stroke="#5b6b82" stroke-width="4"/><polygon points="299,305 287,297 287,313" fill="#5b6b82"/><rect x="299" y="155" width="240" height="310" rx="18" fill="#fff" stroke="#bfd0e2" stroke-width="2"/><circle cx="330" cy="189" r="23" fill="#1e9e94"/><text x="330" y="197" text-anchor="middle" font-size="22" font-family="Arial" font-weight="700" fill="#fff">2</text><text x="361" y="190" font-size="20" font-family="Arial" font-weight="700" fill="#12345b">Encoding</text><text x="321" y="267" font-size="17" font-family="Arial" font-weight="400" fill="#5b6b82">Build embeddings, positions,</text><text x="321" y="291" font-size="17" font-family="Arial" font-weight="400" fill="#5b6b82">masks, and batches.</text><line x1="539" y1="305" x2="553" y2="305" stroke="#5b6b82" stroke-width="4"/><polygon points="553,305 541,297 541,313" fill="#5b6b82"/><rect x="553" y="155" width="240" height="310" rx="18" fill="#fff" stroke="#bfd0e2" stroke-width="2"/><circle cx="584" cy="189" r="23" fill="#f07a28"/><text x="584" y="197" text-anchor="middle" font-size="22" font-family="Arial" font-weight="700" fill="#fff">3</text><text x="615" y="190" font-size="20" font-family="Arial" font-weight="700" fill="#12345b">Baseline setup</text><text x="575" y="267" font-size="17" font-family="Arial" font-weight="400" fill="#5b6b82">RNN / linear or simple</text><text x="575" y="291" font-size="17" font-family="Arial" font-weight="400" fill="#5b6b82">sequence reference.</text><line x1="793" y1="305" x2="807" y2="305" stroke="#5b6b82" stroke-width="4"/><polygon points="807,305 795,297 795,313" fill="#5b6b82"/><rect x="807" y="155" width="240" height="310" rx="18" fill="#fff" stroke="#bfd0e2" stroke-width="2"/><circle cx="838" cy="189" r="23" fill="#7354b5"/><text x="838" y="197" text-anchor="middle" font-size="22" font-family="Arial" font-weight="700" fill="#fff">4</text><text x="869" y="190" font-size="20" font-family="Arial" font-weight="700" fill="#12345b">Transformer training</text><text x="829" y="267" font-size="17" font-family="Arial" font-weight="400" fill="#5b6b82">Train compact attention</text><text x="829" y="291" font-size="17" font-family="Arial" font-weight="400" fill="#5b6b82">model with fixed budget.</text><line x1="1047" y1="305" x2="1061" y2="305" stroke="#5b6b82" stroke-width="4"/><polygon points="1061,305 1049,297 1049,313" fill="#5b6b82"/><rect x="1061" y="155" width="240" height="310" rx="18" fill="#fff" stroke="#bfd0e2" stroke-width="2"/><circle cx="1092" cy="189" r="23" fill="#3f9458"/><text x="1092" y="197" text-anchor="middle" font-size="22" font-family="Arial" font-weight="700" fill="#fff">5</text><text x="1123" y="190" font-size="20" font-family="Arial" font-weight="700" fill="#12345b">Evaluation</text><text x="1083" y="267" font-size="17" font-family="Arial" font-weight="400" fill="#5b6b82">Task metrics, calibration,</text><text x="1083" y="291" font-size="17" font-family="Arial" font-weight="400" fill="#5b6b82">and sequence-length slices.</text><line x1="1301" y1="305" x2="1315" y2="305" stroke="#5b6b82" stroke-width="4"/><polygon points="1315,305 1303,297 1303,313" fill="#5b6b82"/><rect x="1315" y="155" width="240" height="310" rx="18" fill="#fff" stroke="#bfd0e2" stroke-width="2"/><circle cx="1346" cy="189" r="23" fill="#cc4a4a"/><text x="1346" y="197" text-anchor="middle" font-size="22" font-family="Arial" font-weight="700" fill="#fff">6</text><text x="1377" y="190" font-size="20" font-family="Arial" font-weight="700" fill="#12345b">Ablation</text><text x="1337" y="267" font-size="17" font-family="Arial" font-weight="400" fill="#5b6b82">Heads, layers, position</text><text x="1337" y="291" font-size="17" font-family="Arial" font-weight="400" fill="#5b6b82">encoding, and context</text><text x="1337" y="315" font-size="17" font-family="Arial" font-weight="400" fill="#5b6b82">length.</text><rect x="45" y="500" width="980" height="425" rx="22" fill="#fff" stroke="#bfd0e2" stroke-width="2"/><text x="75" y="545" font-size="30" font-family="Arial" font-weight="700" fill="#12345b">Modeling, inference & validation</text><text x="80" y="600" font-size="22" font-family="Georgia" font-style="italic" fill="#12345b">Attention(Q,K,V)=softmax(QKᵀ/√d_k)V</text><text x="80" y="650" font-size="20" font-family="Arial" font-weight="400" fill="#5b6b82">Keep the model deliberately compact and compare under similar</text><text x="80" y="679" font-size="20" font-family="Arial" font-weight="400" fill="#5b6b82">training budgets. Report sequence-length behavior, parameter</text><text x="80" y="708" font-size="20" font-family="Arial" font-weight="400" fill="#5b6b82">count, and ablations rather than assuming attention is</text><text x="80" y="737" font-size="20" font-family="Arial" font-weight="400" fill="#5b6b82">automatically superior.</text><line x1="95" y1="835" x2="470" y2="835" stroke="#5b6b82" stroke-width="2"/><line x1="95" y1="690" x2="95" y2="835" stroke="#5b6b82" stroke-width="2"/><polyline points="95,810 160,785 225,760 290,742 355,725 420,710 470,700" fill="none" stroke="#2f80d1" stroke-width="5"/><polyline points="95,800 160,770 225,740 290,712 355,690 420,672 470,660" fill="none" stroke="#f07a28" stroke-width="5"/><text x="95" y="870" font-size="15" font-family="Arial" fill="#5b6b82">conceptual evaluation trajectory (not measured values)</text><rect x="1050" y="500" width="505" height="425" rx="22" fill="#fff7ef" stroke="#bfd0e2" stroke-width="2"/><text x="1080" y="545" font-size="30" font-family="Arial" font-weight="700" fill="#12345b">Evaluation protocol</text><rect x="1080" y="600" width="440" height="68" rx="14" fill="#fff" stroke="#bfd0e2"/><circle cx="1110" cy="634" r="12" fill="#f07a28"/><text x="1134" y="628" font-size="20" font-family="Arial" font-weight="700" fill="#12345b">Predictive quality</text><text x="1134" y="650" font-size="15" font-family="Arial" fill="#5b6b82">Task-specific held-out metric</text><rect x="1080" y="682" width="440" height="68" rx="14" fill="#fff" stroke="#bfd0e2"/><circle cx="1110" cy="716" r="12" fill="#7354b5"/><text x="1134" y="710" font-size="20" font-family="Arial" font-weight="700" fill="#12345b">Efficiency</text><text x="1134" y="732" font-size="15" font-family="Arial" fill="#5b6b82">Parameters / latency / memory</text><rect x="1080" y="764" width="440" height="68" rx="14" fill="#fff" stroke="#bfd0e2"/><circle cx="1110" cy="798" r="12" fill="#3f9458"/><text x="1134" y="792" font-size="20" font-family="Arial" font-weight="700" fill="#12345b">Ablation</text><text x="1134" y="814" font-size="15" font-family="Arial" fill="#5b6b82">Heads, layers, positions</text><rect x="1080" y="846" width="440" height="68" rx="14" fill="#fff" stroke="#bfd0e2"/><circle cx="1110" cy="880" r="12" fill="#cc4a4a"/><text x="1134" y="874" font-size="20" font-family="Arial" font-weight="700" fill="#12345b">Generalization</text><text x="1134" y="896" font-size="15" font-family="Arial" fill="#5b6b82">Longer / shifted sequences</text><text x="50" y="975" font-size="14" font-family="Arial" fill="#5b6b82">Scientific schematic · processing logic, controls, assumptions, and validation are explicit; empirical results belong in repository outputs.</text></svg>