<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675">
<rect width="1200" height="675" fill="#f8fafc"/>
<text x="60" y="75" font-family="Arial" font-size="34" font-weight="700" fill="#0f172a">Frozen Monthly Forecasting Pipeline</text>
<text x="60" y="112" font-family="Arial" font-size="19" fill="#64748b">WDC-SILSO Version 2.0 · definitive study input through March 2026</text>
<g font-family="Arial" font-size="19" text-anchor="middle">
<rect x="45" y="205" width="190" height="165" rx="18" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><text x="140" y="250" fill="#1e3a8a" font-weight="700">1. Freeze data</text><text x="140" y="288" fill="#334155">3,327 months</text><text x="140" y="320" fill="#334155">hash model input</text><text x="140" y="350" fill="#334155">exclude later rows</text>
<rect x="280" y="205" width="190" height="165" rx="18" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/><text x="375" y="250" fill="#166534" font-weight="700">2. Set timeline</text><text x="375" y="288" fill="#334155">common target dates</text><text x="375" y="320" fill="#334155">train · validation</text><text x="375" y="350" fill="#334155">· test</text>
<rect x="515" y="205" width="190" height="165" rx="18" fill="#ecfeff" stroke="#22d3ee" stroke-width="2"/><text x="610" y="250" fill="#155e75" font-weight="700">3. Build windows</text><text x="610" y="288" fill="#334155">132-month primary</text><text x="610" y="320" fill="#334155">1 · 6 · 12 month</text><text x="610" y="350" fill="#334155">forecast targets</text>
<rect x="750" y="205" width="190" height="165" rx="18" fill="#f3e8ff" stroke="#c084fc" stroke-width="2"/><text x="845" y="250" fill="#6b21a8" font-weight="700">4. Select models</text><text x="845" y="288" fill="#334155">validation MSE</text><text x="845" y="320" fill="#334155">Ridge · HGB</text><text x="845" y="350" fill="#334155">Transformer stop</text>
<rect x="985" y="205" width="170" height="165" rx="18" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/><text x="1070" y="250" fill="#9a3412" font-weight="700">5. Evaluate</text><text x="1070" y="288" fill="#334155">MAE · RMSE</text><text x="1070" y="320" fill="#334155">block bootstrap</text><text x="1070" y="350" fill="#334155">era · activity</text>
</g>
<g stroke="#2563eb" stroke-width="5"><path d="M235 288 H280"/><path d="M470 288 H515"/><path d="M705 288 H750"/><path d="M940 288 H985"/></g>
<rect x="150" y="455" width="900" height="125" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="600" y="497" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#0f172a">Leakage-control rule</text>
<text x="600" y="535" text-anchor="middle" font-family="Arial" font-size="19" fill="#475569">Scaling stops at the last training target. Validation and test target months are identical across horizons</text>
<text x="600" y="565" text-anchor="middle" font-family="Arial" font-size="19" fill="#475569">and across 60-, 132-, and 264-month context-sensitivity conditions.</text>
</svg>